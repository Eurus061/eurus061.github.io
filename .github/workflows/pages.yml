name: Publish blog

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild the current content even if already published
        type: boolean
        default: false

concurrency:
  group: blog-pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    # Public repository + standard Linux runner; no private Actions or paid runners.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    permissions:
      contents: write
      pages: write
      id-token: write
      actions: write
    env:
      PUBLIC_SITE_URL: https://eurus061.github.io
    steps:
      - name: Read public publication state
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: public-site
          ref: main
          persist-credentials: false
      - name: Read private articles
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: Eurus061/jester-blog-content
          ref: main
          path: content
          ssh-key: ${{ secrets.BLOG_CONTENT_READ_KEY }}
          persist-credentials: false
          sparse-checkout: site-engine.json
          sparse-checkout-cone-mode: false
      - name: Check whether content changed
        id: version
        env:
          FORCE: ${{ inputs.force || false }}
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess
          from datetime import datetime, timezone
          from pathlib import Path
          config = json.loads(Path('content/site-engine.json').read_text())
          assert config['repository'] == 'Eurus061/jester-blog'
          revision = config['commit']
          assert re.fullmatch('[0-9a-f]{40}', revision)
          commit = subprocess.check_output(['git', '-C', 'content', 'rev-parse', 'HEAD']).decode().strip()
          state = Path('public-site/.publication.json')
          old = json.loads(state.read_text()) if state.exists() else {}
          due = old.get('next_publication_at')
          due = due and datetime.fromisoformat(due) <= datetime.now(timezone.utc)
          changed = bool(due) or os.environ['FORCE'] == 'true' or old.get('content_commit') != commit or old.get('engine_commit') != revision
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'changed={str(changed).lower()}\nengine={revision}\ncontent={commit}\n')
          print('Content update found.' if changed else 'The current content is already published.')
          PY
      - name: Read the candidate article files
        if: steps.version.outputs.changed == 'true'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: Eurus061/jester-blog-content
          ref: ${{ steps.version.outputs.content }}
          path: content
          ssh-key: ${{ secrets.BLOG_CONTENT_READ_KEY }}
          persist-credentials: false
      - name: Read pinned private site engine
        if: steps.version.outputs.changed == 'true'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: Eurus061/jester-blog
          ref: ${{ steps.version.outputs.engine }}
          path: engine
          ssh-key: ${{ secrets.BLOG_ENGINE_READ_KEY }}
          persist-credentials: false
      - if: steps.version.outputs.changed == 'true'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          package-manager-cache: false
      - if: steps.version.outputs.changed == 'true'
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Check and build the full site
        if: steps.version.outputs.changed == 'true'
        working-directory: engine
        run: |
          npm ci --no-audit --no-fund
          npm run repo:check
          npm test
          python3 -m unittest discover -s tests -p 'test_*.py'
          npm run content:sync -- --content ../content
          npm run content:images
          npm run check
          npm run build
          npm run verify
          npm run pages:prepare
          npm run pages:verify
          python3 scripts/content/publication.py --engine . --output ../public-site --content-commit '${{ steps.version.outputs.content }}'
      - name: Reject stale content before deployment
        if: steps.version.outputs.changed == 'true'
        env:
          CONTENT_READ_KEY: ${{ secrets.BLOG_CONTENT_READ_KEY }}
          EXPECTED_COMMIT: ${{ steps.version.outputs.content }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess, tempfile, urllib.request
          from pathlib import Path
          with tempfile.TemporaryDirectory() as directory:
              key = Path(directory) / 'key'
              key.write_text(os.environ['CONTENT_READ_KEY'] + '\n')
              key.chmod(0o600)
              hosts = Path(directory) / 'hosts'
              meta = json.load(urllib.request.urlopen('https://api.github.com/meta', timeout=20))
              hosts.write_text(''.join('github.com ' + item + '\n' for item in meta['ssh_keys']))
              env = {**os.environ, 'GIT_SSH_COMMAND': f'ssh -i {key} -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile={hosts}'}
              latest = subprocess.check_output(['git', 'ls-remote', 'git@github.com:Eurus061/jester-blog-content.git', 'refs/heads/main'], env=env).decode().split()[0]
              assert latest == os.environ['EXPECTED_COMMIT'], 'Newer content is waiting; retain the current site and let the next run publish it.'
          PY
      - name: Configure Pages
        if: steps.version.outputs.changed == 'true'
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        with:
          enablement: false
      - name: Upload public site only
        if: steps.version.outputs.changed == 'true'
        id: artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: public-site/site
          retention-days: 1
      - name: Deploy
        if: steps.version.outputs.changed == 'true'
        id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
      - name: Record the successful public version
        if: steps.version.outputs.changed == 'true'
        working-directory: public-site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all -- site .publication.json
          # Stage removal of the former root-level static files, preserving workflow files.
          git add --update
          git commit -m 'Publish verified blog content'
          gh auth setup-git
          git push origin HEAD:main
      - name: Remove temporary Pages artifact
        if: always() && steps.artifact.outputs.artifact_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.artifact.outputs.artifact_id }}
        run: gh api --method DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}"
