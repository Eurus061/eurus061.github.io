name: Publish blog

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild the latest articles and source even if already published
        type: boolean
        default: false

concurrency:
  group: blog-pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    # Public repository + standard Linux runner; no private Actions or paid runners.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    permissions:
      contents: write
      pages: write
      id-token: write
      actions: write
    env:
      PUBLIC_SITE_URL: https://blog.365hbgj.com
      PUBLIC_COMMENTS_URL: https://blog.365hbgj.com/comments
      PUBLIC_COMMENTS_EMAIL_ENABLED: 'false'
    steps:
      - name: Read public publication state
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: public-site
          ref: main
          persist-credentials: false
      - name: Read private articles
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: Eurus061/jester-blog-content
          ref: main
          path: content
          ssh-key: ${{ secrets.BLOG_CONTENT_READ_KEY }}
          persist-credentials: false
          sparse-checkout: README.md
          sparse-checkout-cone-mode: false
      - name: Read the latest private site source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: Eurus061/jester-blog
          ref: main
          path: engine
          ssh-key: ${{ secrets.BLOG_ENGINE_READ_KEY }}
          persist-credentials: false
      - name: Check whether articles or source changed
        id: version
        env:
          FORCE: ${{ inputs.force || false }}
        run: |
          python3 engine/scripts/content/versions.py select --content content --engine engine --publication public-site/.publication.json --output "$GITHUB_OUTPUT"
      - name: Read the candidate article files
        if: steps.version.outputs.changed == 'true'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: Eurus061/jester-blog-content
          ref: main
          path: candidate-content
          ssh-key: ${{ secrets.BLOG_CONTENT_READ_KEY }}
          persist-credentials: false
      - if: steps.version.outputs.changed == 'true'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          package-manager-cache: false
      - if: steps.version.outputs.changed == 'true'
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Check and build the full site
        if: steps.version.outputs.changed == 'true'
        working-directory: engine
        run: |
          test "$(git -C ../candidate-content rev-parse HEAD)" = '${{ steps.version.outputs.content }}'
          test "$(git rev-parse HEAD)" = '${{ steps.version.outputs.engine }}'
          npm ci --no-audit --no-fund
          npm run repo:check
          npm test
          python3 -m unittest discover -s tests -p 'test_*.py'
          npm run content:sync -- --content ../candidate-content
          npm run content:images
          npm run check
          npm run build
          npm run verify
          npm run pages:prepare
          npm run pages:verify
          python3 scripts/content/publication.py --engine . --output ../public-site --content-commit '${{ steps.version.outputs.content }}'
      - name: Reject stale articles or source before deployment
        if: steps.version.outputs.changed == 'true'
        env:
          CONTENT_READ_KEY: ${{ secrets.BLOG_CONTENT_READ_KEY }}
          ENGINE_READ_KEY: ${{ secrets.BLOG_ENGINE_READ_KEY }}
        run: |
          python3 engine/scripts/content/versions.py assert-current --content-commit '${{ steps.version.outputs.content }}' --engine-commit '${{ steps.version.outputs.engine }}'
      - name: Configure Pages
        if: steps.version.outputs.changed == 'true'
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        with:
          enablement: false
      - name: Upload public site only
        if: steps.version.outputs.changed == 'true'
        id: artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: public-site/site
          retention-days: 1
      - name: Deploy
        if: steps.version.outputs.changed == 'true'
        id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
      - name: Record the successful public version
        if: steps.version.outputs.changed == 'true'
        working-directory: public-site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all -- site .publication.json
          # Stage removal of the former root-level static files, preserving workflow files.
          git add --update
          if ! git diff --cached --quiet; then
            git commit -m 'Publish verified blog content'
            gh auth setup-git
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo 'Verified public output is unchanged.'
          fi
      - name: Remove temporary Pages artifact
        if: always() && steps.artifact.outputs.artifact_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.artifact.outputs.artifact_id }}
        run: gh api --method DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}"
